services:
  php:
    build:
      context: ./php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: codehub_php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${APP_PATH:-../app}:/var/www/html:cached
      - ${PHP_CONFIG_PATH:-./php/conf.d}:/usr/local/etc/php/custom.d:ro
    working_dir: /var/www/html
    environment:
      PHP_INI_SCAN_DIR: "/usr/local/etc/php/custom.d:/usr/local/etc/php/conf.d"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
      XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-PHPSTORM}
      PHP_IDE_CONFIG: serverName=${XDEBUG_SERVER_NAME:-codehub}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codehub

  nginx:
    image: nginx:stable-alpine
    container_name: codehub_nginx
    depends_on:
      - php
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ${APP_PATH:-../app}:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - codehub

networks:
  codehub:
    name: ${NETWORK_NAME:-codehub}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.29.0.0/24}
